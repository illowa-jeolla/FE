<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="테마, 교통, 동행 취향에 맞는 전라도 관광지를 추천합니다.">
  <title>관광지 취향 추천 | 일로와전라</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260805-2">
  <link rel="stylesheet" href="feature-pages.css?v=20260805-2">
</head>
<body class="feature-page">
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">일</span><span>일로와전라</span></a>
    <nav class="main-nav" aria-label="주요 메뉴">
      <a href="index.html">홈</a><a class="is-active" href="recommend.html">관광지 추천</a><a href="map.html">지역·일자리</a>
      <a href="local-fit.html">AI 매칭</a><a href="community.html">여행 공유</a><a href="gatherings.html">게더링</a>
    </nav>
    <a class="button button-small button-ghost" href="auth.html" data-auth-link>로그인</a>
  </header>

  <main class="feature-page-main">
    <section class="page-intro">
      <div><p class="eyebrow">AI 관광지 추천</p><h1>취향을 알려주면 전라도 여행지를 골라드려요</h1></div>
      <p>여행 테마, 이동 방식, 함께하는 사람을 선택하면 관광데이터를 바탕으로 지금의 취향에 맞는 지역을 추천합니다.</p>
    </section>
    <div class="page-workspace">
      <section class="page-panel">
        <h2>여행 취향 입력</h2>
        <form class="stack-form preference-form" id="recommendation-form">
          <label>선호 지역
            <select name="region"><option value="">전라도 전체</option><option>여수</option><option>순천</option><option>목포</option><option>전주</option><option>광주</option><option>군산</option><option>남원</option><option>담양</option><option>해남</option><option>보성</option><option>완도</option></select>
          </label>
          <fieldset class="preference-group">
            <legend>여행 테마 <span>하나 이상 선택</span></legend>
            <div class="check-options">
              <label><input type="checkbox" name="themes" value="바다"><span>바다</span></label>
              <label><input type="checkbox" name="themes" value="미식"><span>미식</span></label>
              <label><input type="checkbox" name="themes" value="문화"><span>문화</span></label>
              <label><input type="checkbox" name="themes" value="자연"><span>자연</span></label>
              <label><input type="checkbox" name="themes" value="휴식"><span>휴식</span></label>
            </div>
          </fieldset>
          <fieldset class="preference-group">
            <legend>이동 방식 <span>하나 이상 선택</span></legend>
            <div class="check-options">
              <label><input type="checkbox" name="transports" value="대중교통"><span>대중교통</span></label>
              <label><input type="checkbox" name="transports" value="자가용"><span>자가용</span></label>
              <label><input type="checkbox" name="transports" value="도보"><span>도보 중심</span></label>
            </div>
          </fieldset>
          <fieldset class="preference-group">
            <legend>동행 유형 <span>하나 이상 선택</span></legend>
            <div class="check-options">
              <label><input type="checkbox" name="companions" value="혼자"><span>혼자</span></label>
              <label><input type="checkbox" name="companions" value="친구"><span>친구</span></label>
              <label><input type="checkbox" name="companions" value="연인"><span>연인</span></label>
              <label><input type="checkbox" name="companions" value="가족"><span>가족</span></label>
            </div>
          </fieldset>
          <button class="button button-primary" type="submit">AI 추천 생성하기</button>
          <div class="page-status" id="recommendation-status" role="status"></div>
        </form>
      </section>

      <section class="page-panel" aria-live="polite">
        <div class="panel-header"><div><p class="eyebrow">추천 결과</p><h2>나를 위한 전라도</h2></div><span class="tag-row"><span id="recommendation-round">1차 추천</span></span></div>
        <p class="generated-prompt" id="recommendation-prompt">취향을 선택하면 추천 이유와 여행지가 여기에 표시됩니다.</p>
        <div class="preference-results" id="recommendation-results">
          <div class="page-status is-visible">왼쪽에서 여행 취향을 선택해 주세요.</div>
        </div>
        <div class="recommend-actions" hidden id="recommendation-actions">
          <button class="button button-ghost" id="retry-recommendation" type="button">한 번 더 추천</button>
          <button class="button" id="reset-recommendation" type="button">조건 다시 입력</button>
        </div>
      </section>
    </div>
  </main>
  <script src="shared.js?v=20260805-1"></script>
  <script src="recommend.js?v=20260805-1"></script>
</body>
</html>
