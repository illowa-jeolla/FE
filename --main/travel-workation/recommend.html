<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="테마, 교통, 동행 취향에 맞는 전라도 관광지를 추천합니다.">
  <title>관광지 취향 추천 | 일로와전라</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260809-1">
  <link rel="stylesheet" href="feature-pages.css?v=20260807-9">
</head>
<body class="feature-page">
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">일</span><span>일로와전라</span></a>
    <nav class="main-nav" aria-label="주요 메뉴">
      <a href="index.html">홈</a><a class="is-active" href="recommend.html">관광지 추천</a><a href="map.html">지역·일자리</a>
      <a href="local-fit.html">AI 매칭</a><a href="community.html">여행 공유</a><a href="gatherings.html">게더링</a>
    </nav>
    <a class="button button-small button-ghost" href="auth.html" data-auth-link>로그인</a>
  </header>

  <main class="recommend-main">
    <section class="recommend-input" id="recommendation-input-view">
      <aside class="recommend-intro">
        <span class="recommend-step-badge">STEP 1 · 취향 입력</span>
        <h1>어떤 전라도 여행을<br>꿈꾸고 있나요?</h1>
        <p>세 가지만 고르면 AI가 여행 코스를 추천해요.</p>
        <ol class="recommend-progress">
          <li class="is-active"><b>01</b><strong>취향 입력</strong></li>
          <li><b>02</b><span>여행지 추천</span></li>
          <li><b>03</b><span>결과 확인</span></li>
        </ol>
      </aside>

      <form class="recommend-form" id="recommendation-form">
        <input type="hidden" name="region" value="">
        <fieldset class="recommend-choice-group recommend-choice-group--theme">
          <legend><strong>여행 테마</strong><span>복수 선택 가능</span></legend>
          <div class="recommend-options">
            <label><input type="checkbox" name="themes" value="자연" checked><span>자연·힐링</span></label>
            <label><input type="checkbox" name="themes" value="미식" checked><span>미식 여행</span></label>
            <label><input type="checkbox" name="themes" value="사진"><span>감성 사진</span></label>
            <label><input type="checkbox" name="themes" value="문화"><span>역사·문화</span></label>
          </div>
        </fieldset>
        <fieldset class="recommend-choice-group recommend-choice-group--transport">
          <legend><strong>이동 수단</strong><span>하나를 선택해 주세요</span></legend>
          <div class="recommend-options recommend-options--three">
            <label><input type="radio" name="transports" value="자가용"><span>자차</span></label>
            <label><input type="radio" name="transports" value="대중교통" checked><span>대중교통</span></label>
            <label><input type="radio" name="transports" value="도보"><span>도보 중심</span></label>
          </div>
        </fieldset>
        <fieldset class="recommend-choice-group recommend-choice-group--companion">
          <legend><strong>누구와 함께</strong><span>하나를 선택해 주세요</span></legend>
          <div class="recommend-options">
            <label><input type="radio" name="companions" value="혼자"><span>혼자</span></label>
            <label><input type="radio" name="companions" value="연인"><span>연인</span></label>
            <label><input type="radio" name="companions" value="친구" checked><span>친구</span></label>
            <label><input type="radio" name="companions" value="가족"><span>가족</span></label>
          </div>
        </fieldset>
        <div class="recommend-prompt-preview"><span>⌄</span><strong>AI 프롬프트 미리보기</strong></div>
        <button class="recommend-submit" type="submit">내 취향으로 추천 받기&nbsp; →</button>
        <div class="page-status" id="recommendation-status" role="status"></div>
      </form>
    </section>

    <section class="recommend-result" id="recommendation-result-view" hidden aria-live="polite">
      <header class="recommend-result-header">
        <div><span class="recommend-step-badge" id="recommendation-round">추천 결과 · 1 / 3</span><h1 id="recommendation-title">초록과 미식을 따라가는<br>남도 감각 여행</h1></div>
        <div class="recommend-match"><span>취향 일치도</span><strong id="recommendation-match-score">92%</strong></div>
      </header>
      <div class="recommend-selected" id="recommendation-selected"></div>
      <p class="generated-prompt" id="recommendation-prompt"></p>
      <div class="recommend-card-grid" id="recommendation-results"></div>
      <footer class="recommend-result-footer">
        <p id="recommendation-help">↻ 아직 새로운 여행지가 있어요.</p>
        <div class="recommend-actions" id="recommendation-actions">
          <button class="button" id="reset-recommendation" type="button">조건 수정</button>
          <button class="button button-primary" id="retry-recommendation" type="button">다른 여행지 추천&nbsp; ↻</button>
        </div>
      </footer>
    </section>
  </main>
  <script src="shared.js?v=20260809-1"></script>
  <script src="recommend.js?v=20260809-2"></script>
</body>
</html>
