<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여행 기록 작성 | 일로와전라</title>
  <link rel="stylesheet" href="styles.css?v=20260805-2"><link rel="stylesheet" href="feature-pages.css?v=20260807-13">
</head>
<body class="feature-page">
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">일</span><span>일로와전라</span></a>
    <nav class="main-nav" aria-label="주요 메뉴"><a href="index.html">홈</a><a href="recommend.html">관광지 추천</a><a href="map.html">지역·일자리</a><a href="local-fit.html">AI 매칭</a><a class="is-active" href="community.html">여행 공유</a><a href="gatherings.html">게더링</a></nav>
    <a class="button button-small button-ghost" href="auth.html" data-auth-link>로그인</a>
  </header>
  <main class="community-write-main">
    <header class="community-subpage-header"><div><p class="eyebrow dark">여행 기록</p><h1>지금의 여행을 기록하고 공유해요</h1></div><p>사진과 짧은 기록을 남겨보세요.</p></header>
    <form class="community-write-card" id="post-form">
      <div><p class="eyebrow dark">새 게시글</p><h2>여행 글 작성하기</h2><span>사진과 지역, 지금의 분위기를 기록해 주세요.</span></div>
      <section class="community-photo-upload"><strong>사진 업로드</strong><p>첫 번째 사진이 대표로 보여져요 · 최대 5장</p><input type="file" id="post-image" accept="image/png,image/jpeg,image/webp" multiple><div class="photo-preview-grid" id="post-preview"><button class="photo-add-card" type="button"><span>＋</span><b>사진 추가</b></button></div></section>
      <div class="form-row"><label>지역<select name="region" required><option value="">지역 선택</option><option>여수</option><option>순천</option><option>목포</option><option>전주</option><option>광주</option><option>군산</option><option>남원</option><option>담양</option><option>해남</option><option>보성</option><option>완도</option></select></label><label>여행 콘셉트<input name="concept" placeholder="예: 노을 드라이브" required></label></div>
      <label>여행 내용<textarea name="content" maxlength="500" placeholder="현장의 분위기와 여행 팁을 남겨보세요." required></textarea></label>
      <label>해시태그<input name="hashtags" maxlength="100" placeholder="#노을맛집 #바다산책 #여수여행"><small>공백이나 쉼표로 구분해 최대 5개까지 입력할 수 있어요.</small></label>
      <div class="community-write-actions"><a class="button" href="community.html">취소</a><button class="button button-primary" type="submit">여행을 공유하기</button></div>
      <div class="page-status" id="post-status" role="status"></div>
    </form>
  </main>
  <script src="shared.js?v=20260807-7"></script><script src="community-write.js?v=20260807-3"></script>
</body>
</html>
