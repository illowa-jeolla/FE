<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="다녀온 여행과 여행 콘셉트를 기록하고 로컬 핏 점수를 확인합니다.">
  <title>AI 전라도 라이프 매칭 | 일로와전라</title>
  <link rel="stylesheet" href="styles.css?v=20260805-2">
  <link rel="stylesheet" href="feature-pages.css?v=20260805-2">
</head>
<body class="feature-page">
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">일</span><span>일로와전라</span></a>
    <nav class="main-nav" aria-label="주요 메뉴">
      <a href="index.html">홈</a><a href="recommend.html">관광지 추천</a><a href="map.html">지역·일자리</a>
      <a class="is-active" href="local-fit.html">AI 매칭</a><a href="community.html">여행 공유</a><a href="gatherings.html">게더링</a>
    </nav>
    <a class="button button-small button-ghost" href="auth.html" data-auth-link>로그인</a>
  </header>

  <main class="feature-page-main">
    <section class="page-intro">
      <div><p class="eyebrow dark">AI 전라도 라이프 매칭</p><h1>AI가 전라도에서 살 곳·일·여행을 함께 찾아드려요</h1></div>
      <p>여행 경험과 생활 취향을 기록하면 관광데이터를 기준으로 지역 적합도를 계산하고 다음 일자리 추천에 활용합니다.</p>
    </section>

    <div class="page-workspace">
      <section class="page-panel">
        <h2>AI 매칭 조건</h2>
        <form class="stack-form" id="local-fit-form">
          <div class="form-row">
            <label>기준 여행 경험<input name="destinationName" placeholder="예: 여수 밤바다 여행" required></label>
            <label>지역
              <select name="region" required>
                <option value="">지역 선택</option><option>여수</option><option>순천</option>
                <option>목포</option><option>전주</option><option>광주</option><option>군산</option>
                <option>남원</option><option>담양</option><option>해남</option><option>보성</option><option>완도</option>
              </select>
            </label>
          </div>
          <label>생활·여행 취향<input name="concept" placeholder="예: 바다 산책과 로컬 미식" required></label>
          <div class="form-row">
            <label>교통
              <select name="transport"><option>대중교통</option><option>자가용</option><option>도보 중심</option></select>
            </label>
            <label>동행
              <select name="companion"><option>혼자</option><option>친구</option><option>연인</option><option>가족</option></select>
            </label>
          </div>
          <div class="metric-list">
            <label class="metric-control">지역 몰입감<input type="range" name="immersion" min="1" max="5" value="3"><output>3</output></label>
            <label class="metric-control">새로운 발견<input type="range" name="discovery" min="1" max="5" value="3"><output>3</output></label>
            <label class="metric-control">이동 편의<input type="range" name="convenience" min="1" max="5" value="3"><output>3</output></label>
            <label class="metric-control">지역 연결감<input type="range" name="connection" min="1" max="5" value="3"><output>3</output></label>
          </div>
          <label>한 줄 기록<textarea name="note" placeholder="기억하고 싶은 순간을 남겨보세요."></textarea></label>
          <button class="button button-primary" type="submit">AI 라이프 매칭 분석</button>
          <div class="page-status" id="local-fit-status" role="status"></div>
        </form>
      </section>

      <section class="page-panel">
        <div class="score-overview">
          <div class="score-ring" id="score-ring" style="--score:0%"><div><strong id="average-score">-</strong><span>점</span></div></div>
          <div class="score-copy"><p class="eyebrow dark">AI 매칭 결과</p><h3 id="score-title">조건 입력을 기다리고 있어요</h3><p>네 가지 생활 지표를 100점으로 환산합니다.</p><a class="detail-link" href="jobs.html">이 점수로 일자리 추천받기 →</a></div>
        </div>
        <div class="record-list" id="local-fit-list">
          <div class="page-status is-visible">로그인 후 여행 기록을 확인할 수 있습니다.</div>
        </div>
      </section>
    </div>
  </main>
  <script src="shared.js?v=20260805-1"></script>
  <script src="local-fit.js?v=20260805-1"></script>
</body>
</html>
