<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="일로와전라 로그인 및 회원가입">
  <title>로그인 | 일로와전라</title>
  <link rel="stylesheet" href="styles.css?v=20260805-2">
  <link rel="stylesheet" href="auth.css?v=20260811-2">
</head>
<body class="auth-page">
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">일</span><span>일로와전라</span></a>
    <nav class="main-nav" aria-label="주요 메뉴">
      <a href="index.html">홈</a><a href="recommend.html">관광지 추천</a><a href="map.html">지역·일자리</a>
      <a href="local-fit.html">AI 매칭</a><a href="community.html">여행 공유</a><a href="gatherings.html">게더링</a>
    </nav>
    <a class="button button-small button-ghost" href="auth.html" aria-current="page">로그인</a>
  </header>

  <main class="auth-main">
    <section class="auth-intro">
      <p class="eyebrow">여행과 일을 한 계정으로</p>
      <h1>전라도에서 시작할<br>새로운 하루를 준비하세요</h1>
      <p>관심 지역과 지원 공고를 안전하게 관리해요.</p>
    </section>

    <section class="auth-panel" aria-labelledby="auth-title">
      <div class="auth-tabs" role="tablist" aria-label="계정 메뉴">
        <button class="auth-tab is-active" type="button" role="tab" aria-selected="true" data-auth-view="login">로그인</button>
        <button class="auth-tab" type="button" role="tab" aria-selected="false" data-auth-view="register">회원가입</button>
      </div>

      <form class="auth-form" id="login-form">
        <div><p class="auth-label">다시 만나 반가워요</p><h2 id="auth-title">로그인</h2></div>
        <label>이메일<input type="email" name="email" autocomplete="email" inputmode="email" maxlength="254" placeholder="name@example.com" required></label>
        <label>비밀번호<input type="password" name="password" autocomplete="current-password" minlength="8" placeholder="8자 이상 입력해 주세요" required></label>
        <button class="button button-primary" type="submit">로그인</button>
        <div class="auth-socials">
          <p class="auth-divider">또는 간편 로그인</p>
          <button class="social-button kakao" type="button" data-social-login="카카오">카카오로 계속하기</button>
          <button class="social-button google" type="button" data-social-login="구글">Google로 계속하기</button>
        </div>
      </form>

      <form class="auth-form" id="register-form" hidden>
        <div><p class="auth-label">처음 오셨나요?</p><h2>회원가입</h2></div>
        <label>이메일<input type="email" name="email" autocomplete="email" inputmode="email" maxlength="254" placeholder="name@example.com" required></label>
        <label>닉네임<input name="nickname" autocomplete="nickname" maxlength="50" placeholder="서비스에서 사용할 이름" required></label>
        <label>비밀번호<input type="password" name="password" autocomplete="new-password" minlength="8" placeholder="8자 이상 입력해 주세요" required></label>
        <label>비밀번호 확인<input type="password" name="passwordConfirm" autocomplete="new-password" minlength="8" placeholder="비밀번호를 한 번 더 입력해 주세요" required></label>
        <button class="button button-primary" type="submit">계정 만들기</button>
      </form>

      <p class="auth-message" id="auth-message" role="status" aria-live="polite">로그인하면 저장한 기록을 이어볼 수 있어요.</p>
    </section>
  </main>
  <script src="auth-api-config.js?v=20260813-1"></script>
  <script src="auth.js?v=20260813-1"></script>
</body>
</html>
