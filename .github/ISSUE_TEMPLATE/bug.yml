name: "🐛 Bug"
description: "발생한 버그를 수정하기 위한 이슈입니다."
title: "[BUG] "
labels:
  - "bug"

body:
  - type: textarea
    id: description
    attributes:
      label: "🐛 버그 설명"
      description: "현재 발생하고 있는 문제를 설명해주세요."
      placeholder: |
        예) 로그인 버튼을 클릭하면 페이지가 멈춥니다.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "🔄 재현 방법"
      description: "버그를 재현할 수 있는 순서를 작성해주세요."
      placeholder: |
        1. 로그인 페이지 접속
        2. 이메일과 비밀번호 입력
        3. 로그인 버튼 클릭
        4. 오류 발생
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "✅ 기대 동작"
      description: "정상적으로 동작했을 때 기대하는 결과를 작성해주세요."
      placeholder: |
        예) 로그인 성공 후 메인 페이지로 이동해야 합니다.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "📎 로그 및 스크린샷"
      description: "관련 로그나 스크린샷이 있다면 첨부해주세요."