name: "♻️ Refactor"
description: "기존 코드 개선 및 리팩토링을 위한 이슈입니다."
title: "[REFACTOR] "
labels:
  - "refactor"

body:
  - type: textarea
    id: target
    attributes:
      label: "📌 리팩토링 대상"
      description: "리팩토링이 필요한 코드 또는 기능을 설명해주세요."
      placeholder: |
        예) 관광지 검색 관련 JavaScript 로직
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: "🤔 리팩토링 이유"
      description: "왜 리팩토링이 필요한지 작성해주세요."
      placeholder: |
        예)
        - 중복 코드가 많음
        - 함수의 역할이 너무 많음
        - 유지보수가 어려움
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "✅ 작업 내용"
      description: "리팩토링할 내용을 체크리스트로 작성해주세요."
      placeholder: |
        - [ ] 중복 코드 제거
        - [ ] 함수 분리
        - [ ] 변수명 개선
        - [ ] 불필요한 코드 제거
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "✨ 기대 효과"
      description: "리팩토링 후 기대되는 개선점을 작성해주세요."
      placeholder: |
        예)
        - 코드 가독성 향상
        - 유지보수성 향상
        - 중복 코드 감소