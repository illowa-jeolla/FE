name: "✨ Feature"
description: "새로운 기능 개발을 위한 이슈입니다."
title: "[FEAT] "
labels:
  - "feat"

body:
  - type: textarea
    id: description
    attributes:
      label: "📌 기능 설명"
      description: "구현하려는 기능을 설명해주세요."
      placeholder: |
        예) 사용자의 여행 조건을 기반으로 관광지를 추천하는 기능을 구현합니다.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "✅ 작업 내용"
      description: "구현해야 할 작업을 체크리스트로 작성해주세요."
      placeholder: |
        - [ ] UI 구현
        - [ ] API 연동
        - [ ] 예외 처리
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: "🔗 참고 사항"
      description: "관련 문서, 디자인, API 등이 있다면 작성해주세요."
      placeholder: |
        Figma:
        API 문서:
        참고 자료: